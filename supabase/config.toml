# Configuração do Supabase CLI — EbenézerConecta
project_id = "ebenezer-conecta"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google entra quando as credenciais existirem — ver docs/operacao.md
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

# Bucket público de imagens ilustrativas. Os arquivos em ./storage/midia são enviados no `supabase start`.
# Os .jpg versionados são ESPAÇOS RESERVADOS: substitua pelas seis fotos ilustrativas mantendo os nomes.
[storage.buckets.midia]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
objects_path = "./storage/midia"
